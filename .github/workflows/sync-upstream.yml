name: Sync Fork 自动同步上游deepseek-pp
# 关键：赋予action写入仓库的权限，解决exit code 128
permissions:
  contents: write

on:
  schedule:
    - cron: '0 2 * * *' # UTC 02:00 = 北京时间上午10点，每日自动同步
  workflow_dispatch: # 网页手动触发开关

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork with upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: zhu1090093659/deepseek-pp
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
